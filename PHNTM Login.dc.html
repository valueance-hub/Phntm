<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<title>PHNTM — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PHNTM">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0e0e0e;color:#eaeaea;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:#eaeaea;text-decoration:none}a:hover{color:#fff}
::selection{background:rgba(255,255,255,.2)}
input{outline:none}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 1000px #0e0e0e inset;caret-color:#fff;transition:background-color 9999s ease-in-out 0s}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spinRing{to{transform:rotate(360deg)}}
@keyframes mdMark{0%{opacity:0;transform:translateY(62px)}42%{opacity:1}100%{opacity:1;transform:translateY(0)}}
@keyframes twinkle0{0%,100%{opacity:1}50%{opacity:.42}}
@keyframes twinkle1{0%,100%{opacity:.9}50%{opacity:.3}}
@keyframes twinkle2{0%,100%{opacity:.75}50%{opacity:.22}}
@keyframes twinkle3{0%,100%{opacity:1}50%{opacity:.55}}
13%{opacity:0;transform:rotate(28deg) translateX(340px) scaleX(1)}100%{opacity:0;transform:rotate(28deg) translateX(340px) scaleX(1)}}
10%{opacity:0;transform:rotate(34deg) translateX(300px) scaleX(1)}100%{opacity:0;transform:rotate(34deg) translateX(300px) scaleX(1)}}
9%{opacity:0;transform:rotate(22deg) translateX(280px) scaleX(1)}100%{opacity:0;transform:rotate(22deg) translateX(280px) scaleX(1)}}
@keyframes breatheGlow{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 34px rgba(255,255,255,.045)}}
@keyframes asTrail{0%{opacity:0;transform:scaleY(0)}28%{opacity:.8}100%{opacity:0;transform:scaleY(1)}}
@keyframes mdRule{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
}
}
}
}
@keyframes riseUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holoLogoIn{0%{opacity:0;text-shadow:5px 0 rgba(255,255,255,.6),-5px 0 rgba(255,255,255,.4)}55%{opacity:1}100%{opacity:1;text-shadow:0 0 rgba(255,255,255,0)}}
@keyframes holoFlickerIn{0%{opacity:0}10%{opacity:1}15%{opacity:.4}20%{opacity:.85}26%{opacity:1}100%{opacity:1}}
@keyframes holoIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@media (max-width:900px){
  [data-m~="card"]{width:100% !important;max-width:400px;padding:34px 22px !important}
  [data-m~="card"] input{font-size:16px !important}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-delay:0ms !important}
  [style*="riseUp"],[style*="fadeUp"]{animation:fadeIn .2s ease both !important}
}
</style>
</helmet>
<div style="position:relative;display:flex;flex-direction:column;min-height:100vh;background:#0e0e0e;overflow:hidden">
  <div style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden"><span style="position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%;background:transparent;box-shadow:7vw 14vh 0 0 rgba(255,255,255,0.5),31vw 9vh 0 0 rgba(255,255,255,0.5),58vw 12vh 0 0 rgba(255,255,255,0.5),83vw 54vh 0 0 rgba(255,255,255,0.5),22vw 44vh 0 0 rgba(255,255,255,0.5),68vw 88vh 0 0 rgba(255,255,255,0.5),44vw 21vh 0 0 rgba(255,255,255,0.5),94vw 44vh 0 0 rgba(255,255,255,0.5),12vw 62vh 0 0 rgba(255,255,255,0.5),76vw 25vh 0 0 rgba(255,255,255,0.5),38vw 71vh 0 0 rgba(255,255,255,0.5),61vw 33vh 0 0 rgba(255,255,255,0.5),3vw 29vh 0 0 rgba(255,255,255,0.5),49vw 58vh 0 0 rgba(255,255,255,0.5),87vw 37vh 0 0 rgba(255,255,255,0.5),27vw 16vh 0 0 rgba(255,255,255,0.5),70vw 61vh 0 0 rgba(255,255,255,0.5),17vw 76vh 0 0 rgba(255,255,255,0.5);animation:twinkle0 4.2s 0s ease-in-out infinite"></span><span style="position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%;background:transparent;box-shadow:19vw 31vh 0 0 rgba(255,255,255,0.34),52vw 67vh 0 0 rgba(255,255,255,0.34),89vw 16vh 0 0 rgba(255,255,255,0.34),4vw 78vh 0 0 rgba(255,255,255,0.34),35vw 66vh 0 0 rgba(255,255,255,0.34),71vw 73vh 0 0 rgba(255,255,255,0.34),26vw 78vh 0 0 rgba(255,255,255,0.34),80vw 36vh 0 0 rgba(255,255,255,0.34),15vw 88vh 0 0 rgba(255,255,255,0.34),48vw 86vh 0 0 rgba(255,255,255,0.34),64vw 19vh 0 0 rgba(255,255,255,0.34),97vw 72vh 0 0 rgba(255,255,255,0.34),9vw 52vh 0 0 rgba(255,255,255,0.34),43vw 41vh 0 0 rgba(255,255,255,0.34),74vw 14vh 0 0 rgba(255,255,255,0.34),56vw 92vh 0 0 rgba(255,255,255,0.34),30vw 35vh 0 0 rgba(255,255,255,0.34),85vw 66vh 0 0 rgba(255,255,255,0.34);animation:twinkle1 5.6s 1.3s ease-in-out infinite"></span><span style="position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%;background:transparent;box-shadow:12vw 24vh 0 0 rgba(255,255,255,0.24),41vw 52vh 0 0 rgba(255,255,255,0.24),57vw 35vh 0 0 rgba(255,255,255,0.24),86vw 82vh 0 0 rgba(255,255,255,0.24),29vw 61vh 0 0 rgba(255,255,255,0.24),73vw 47vh 0 0 rgba(255,255,255,0.24),9vw 41vh 0 0 rgba(255,255,255,0.24),50vw 8vh 0 0 rgba(255,255,255,0.24),92vw 28vh 0 0 rgba(255,255,255,0.24),33vw 92vh 0 0 rgba(255,255,255,0.24),66vw 63vh 0 0 rgba(255,255,255,0.24),21vw 7vh 0 0 rgba(255,255,255,0.24),46vw 74vh 0 0 rgba(255,255,255,0.24),79vw 21vh 0 0 rgba(255,255,255,0.24),5vw 66vh 0 0 rgba(255,255,255,0.24),62vw 80vh 0 0 rgba(255,255,255,0.24),37vw 27vh 0 0 rgba(255,255,255,0.24),96vw 57vh 0 0 rgba(255,255,255,0.24);animation:twinkle2 7.1s 2.6s ease-in-out infinite"></span><span style="position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%;background:transparent;box-shadow:24vw 19vh 0 0.5px rgba(255,255,255,0.8),66vw 58vh 0 0.5px rgba(255,255,255,0.8),91vw 69vh 0 0.5px rgba(255,255,255,0.8),41vw 82vh 0 0.5px rgba(255,255,255,0.8),54vw 48vh 0 0.5px rgba(255,255,255,0.8),16vw 54vh 0 0.5px rgba(255,255,255,0.8),78vw 9vh 0 0.5px rgba(255,255,255,0.8),46vw 36vh 0 0.5px rgba(255,255,255,0.8),8vw 88vh 0 0.5px rgba(255,255,255,0.8),88vw 48vh 0 0.5px rgba(255,255,255,0.8),34vw 49vh 0 0.5px rgba(255,255,255,0.8),69vw 31vh 0 0.5px rgba(255,255,255,0.8);animation:twinkle3 3.4s .7s ease-in-out infinite"></span></div>
  <sc-if value="{{ loaderPresent }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;z-index:5;background:{{ introBg }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:60px 54px;opacity:{{ loaderOpacity }};transition:opacity .55s cubic-bezier(.16,1,.3,1)">
      <div style="position:relative;display:grid;place-items:center;overflow:hidden;padding:34px 0">
        <span style="position:absolute;bottom:0;width:2px;height:54%;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);transform-origin:bottom;animation:asTrail 1.5s cubic-bezier(.32,.72,0,1) both"></span>
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;animation:mdMark 1.5s cubic-bezier(.16,1,.3,1) both">
          <span style="font-family:'Michroma',sans-serif;font-size:30px;letter-spacing:.02em;color:#fff">phntm<span style="display:inline-block;color:#fff;animation:dotPulse 1.8s ease-in-out infinite">.</span></span>
          <div style="width:150px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform-origin:center;animation:mdRule 1.7s .24s cubic-bezier(.16,1,.3,1) both"></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;line-height:1">
        <span style="font-family:'Archivo',sans-serif;font-size:16px;color:#b0b0b0">{{ resumeLabel }}</span>
        <div style="font-family:'Archivo',sans-serif;font-size:16px;color:#fff;font-variant-numeric:tabular-nums">{{ pctLabel }}</div>
        <svg width="20" height="20" viewBox="0 0 60 60" style="display:block;animation:spinRing 1.4s linear infinite;overflow:visible">
          <circle cx="30" cy="30" r="27" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 25 60 25"></circle>
        </svg>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ loginMounted }}" hint-placeholder-val="{{ false }}">
  <div style="display:contents">
  <div style="position:relative;z-index:1;height:40px"></div>
  <div style="position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:24px">
    <div data-m="card" style="position:relative;width:396px;box-sizing:border-box;padding:46px 42px;display:flex;flex-direction:column;gap:28px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.012)) padding-box,linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.06) 42%,rgba(255,255,255,.03)) border-box;border:1px solid transparent;border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);isolation:isolate;will-change:transform,opacity;animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both,holoFlickerIn .7s both,breatheGlow 4.6s 1.1s ease-in-out infinite">
      <div style="text-align:center">
        <span style="font-family:'Michroma',sans-serif;font-size:32px;letter-spacing:.01em;color:#fff;display:inline-block;animation:holoLogoIn .5s .06s cubic-bezier(.16,1,.3,1) both">phntm<span style="display:inline-block;color:#fff;animation:dotPulse 1.8s ease-in-out infinite">.</span></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:24px;animation:holoIn .5s .16s cubic-bezier(.16,1,.3,1) both">
        <div>
          <label style="font-size:12px;color:#a0a0a0">Email</label>
          <input type="email" name="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder="ghost@phntm.io" value="{{ email }}" onChange="{{ setEmail }}" onKeyDown="{{ onPassKey }}" style="width:100%;box-sizing:border-box;margin-top:8px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:16px;padding:10px 0;transition:border-color .3s" style-focus="border-color:#fff">
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <label style="font-size:12px;color:#a0a0a0">Password</label>
            <a href="#" onClick="{{ openForgot }}" style="font-size:12px;color:#a0a0a0;transition:color .3s" style-hover="color:#fff">Forgot?</a>
          </div>
          <div style="position:relative">
            <input type="{{ passType }}" name="password" autocomplete="current-password" placeholder="••••••••••" value="{{ password }}" onChange="{{ setPassword }}" onKeyDown="{{ onPassKey }}" style="width:100%;box-sizing:border-box;margin-top:8px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:16px;padding:10px 32px 10px 0;transition:border-color .3s" style-focus="border-color:#fff">
            <button type="button" onClick="{{ togglePass }}" aria-label="Show or hide password" style="position:absolute;right:0;bottom:9px;background:none;border:none;padding:2px;margin:0;cursor:pointer;color:#a0a0a0;display:flex;align-items:center;transition:color .25s" style-hover="color:#fff">
              <sc-if value="{{ notShowPass }}" hint-placeholder-val="{{ true }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
              <sc-if value="{{ showPass }}" hint-placeholder-val="{{ false }}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              </sc-if>
            </button>
          </div>
        </div>
      </div>
      <button onClick="{{ submit }}" style="display:flex;align-items:center;justify-content:center;gap:10px;border:none;background:#fff;color:#000;font-family:'Archivo',sans-serif;font-size:14.5px;font-weight:500;padding:16px;border-radius:99px;cursor:pointer;animation:holoIn .5s .24s cubic-bezier(.16,1,.3,1) both;transition:opacity .3s,transform .16s ease-out,gap .3s" style-hover="opacity:.85;gap:18px" style-active="opacity:.7;transform:scale(.97)">
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
          <span style="width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#000;animation:spinRing .7s linear infinite"></span>
          <span>Signing in…</span>
        </sc-if>
        <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
          <span>Login</span><span>→</span>
        </sc-if>
      </button>
      <sc-if value="{{ hasAuthErr }}" hint-placeholder-val="{{ false }}"><div style="text-align:center;font-size:12.5px;color:#e0a05a;margin-top:-14px">{{ authErr }}</div></sc-if>
      <div style="display:flex;align-items:center;gap:16px;animation:riseUp .42s .24s cubic-bezier(.16,1,.3,1) both">
        <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
        <span style="font-size:12px;color:#a0a0a0">or</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
      </div>
      <div style="display:flex;gap:12px;animation:riseUp .42s .3s cubic-bezier(.16,1,.3,1) both">
        <button type="button" onClick="{{ googleIn }}" style="flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:13px;color:#eaeaea;font-family:'Archivo',sans-serif;font-size:13.5px;cursor:pointer;transition:border-color .3s,background .3s,transform .16s ease-out" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)" style-active="transform:scale(.97)">Google</button>
        <button type="button" onClick="{{ appleIn }}" style="flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:13px;color:#eaeaea;font-family:'Archivo',sans-serif;font-size:13.5px;cursor:pointer;transition:border-color .3s,background .3s,transform .16s ease-out" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)" style-active="transform:scale(.97)">Apple</button>
      </div>
      <div style="text-align:center;font-size:13px;color:#a0a0a0;animation:riseUp .42s .36s cubic-bezier(.16,1,.3,1) both">No account yet? <a href="#" onClick="{{ openSignup }}" style="color:#eaeaea;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;padding-bottom:3px;transition:background-size .45s cubic-bezier(.16,1,.3,1)" style-hover="background-size:100% 1px">Sign up</a></div>
    </div>
  </div>
  <div style="position:relative;z-index:1;height:36px"></div>
  </div>
  </sc-if>
  <sc-if value="{{ forgotOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeForgot }}" style="position:fixed;inset:0;z-index:20;background:rgba(4,4,4,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s ease both">
      <div onClick="{{ stop }}" style="width:400px;max-width:100%;box-sizing:border-box;padding:38px 36px;background:#0e0e0e;border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both">
        <div style="font-family:'Michroma',sans-serif;font-size:16px;color:#fff;margin-bottom:6px">Reset password</div>
        <div style="font-size:13px;color:#a0a0a0;line-height:1.55;margin-bottom:22px">Enter your account email. We will send a reset link.</div>
        <sc-if value="{{ forgotSent }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:14px;color:#eaeaea;padding:10px 0 22px">✓ Link sent to <span style="color:#fff">{{ forgotEmail }}</span>. Check your inbox.</div>
        </sc-if>
        <sc-if value="{{ forgotNotSent }}" hint-placeholder-val="{{ true }}">
          <input type="email" placeholder="you@email.com" value="{{ forgotEmail }}" onInput="{{ setForgotEmail }}" style="width:100%;box-sizing:border-box;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:15px;padding:10px 0;margin-bottom:24px;transition:border-color .3s" style-focus="border-color:#fff">
          <button onClick="{{ sendForgot }}" style="width:100%;border:none;background:#fff;color:#000;font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:14px;border-radius:99px;cursor:pointer;transition:opacity .3s,transform .16s ease-out" style-hover="opacity:.85" style-active="transform:scale(.98)">Send reset link</button>
        </sc-if>
        <button onClick="{{ closeForgot }}" style="width:100%;margin-top:10px;border:none;background:none;color:#a0a0a0;font-family:'Archivo',sans-serif;font-size:13px;padding:10px;cursor:pointer;transition:color .3s" style-hover="color:#fff">Close</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ signupOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeSignup }}" style="position:fixed;inset:0;z-index:20;background:rgba(4,4,4,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s ease both">
      <div onClick="{{ stop }}" style="width:400px;max-width:100%;box-sizing:border-box;padding:38px 36px;background:#0e0e0e;border:1px solid rgba(255,255,255,.12);border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.6);animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both">
        <div style="font-family:'Michroma',sans-serif;font-size:16px;color:#fff;margin-bottom:6px">Create account</div>
        <div style="font-size:13px;color:#a0a0a0;line-height:1.55;margin-bottom:22px">One account. Every device.</div>
        <div style="display:flex;flex-direction:column;gap:18px;margin-bottom:18px">
          <input placeholder="Name" value="{{ suName }}" onInput="{{ setSuName }}" style="width:100%;box-sizing:border-box;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:15px;padding:10px 0;transition:border-color .3s" style-focus="border-color:#fff">
          <input type="email" placeholder="Email" value="{{ suEmail }}" onInput="{{ setSuEmail }}" style="width:100%;box-sizing:border-box;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:15px;padding:10px 0;transition:border-color .3s" style-focus="border-color:#fff">
          <input type="password" name="new-password" autocomplete="new-password" placeholder="Password" value="{{ suPass }}" onInput="{{ setSuPass }}" style="width:100%;box-sizing:border-box;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:15px;padding:10px 0;transition:border-color .3s" style-focus="border-color:#fff">
        </div>
        <sc-if value="{{ hasSuErr }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12.5px;color:#e8ab6a;line-height:1.5;margin:0 0 18px">{{ suErr }}</div>
        </sc-if>
        <button onClick="{{ createAccount }}" style="width:100%;border:none;background:#fff;color:#000;font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:14px;border-radius:99px;cursor:pointer;opacity:{{ suReadyOpacity }};transition:opacity .3s,transform .16s ease-out" style-active="transform:scale(.98)">{{ suBtnLabel }}</button>
        <button onClick="{{ closeSignup }}" style="width:100%;margin-top:10px;border:none;background:none;color:#a0a0a0;font-family:'Archivo',sans-serif;font-size:13px;padding:10px;cursor:pointer;transition:color .3s" style-hover="color:#fff">Close</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;noteBg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#272727&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1b1b1b&quot;,&quot;#1f1f1f&quot;,&quot;#1b1b1b&quot;,&quot;#1f1f1f&quot;,&quot;#272727&quot;],&quot;section&quot;:&quot;Note editor&quot;}}">
class Component extends DCLogic {
  state = { name: '', email: '', password: '', loading: false, phase: 'load', pct: 0, forgotLabel: 'Forgot?', forgotOpen: false, forgotEmail: '', forgotSent: false, signupOpen: false, suName: '', suEmail: '', suPass: '' };
  _authMsg(err) {
    const m = (err && err.message) || 'Something went wrong.';
    if (/invalid login credentials|invalid credentials|bad credential/i.test(m)) return 'Incorrect email or password.';
    if (/invalid.*(email|password)/i.test(m)) return 'Incorrect email or password.';
    if (/rate|too many/i.test(m)) return 'Too many attempts. Wait a moment.';
    if (/email not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox.';
    if (/already registered|already exists/i.test(m)) return 'That email already has an account. Sign in instead.';
    if (/password/i.test(m) && /6|short|least/i.test(m)) return 'Password must be at least 6 characters.';
    if (/failed to fetch|networkerror|network request failed|offline|load failed/i.test(m)) return 'No connection to the server.';
    return m;
  }
  _validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }
  async _oauth(provider) {
    if (this.state.loading) return;
    this.setState({ loading: true, authErr: '' });
    try {
      const A = window.PHNTM && window.PHNTM.auth;
      if (!A || !A.signInWithProvider) throw new Error('Auth unavailable.');
      await A.signInWithProvider(provider); // navigates away on success
    } catch (err) {
      const m = (err && err.message) || '';
      const off = provider === 'google' ? 'Google sign-in isn\u2019t switched on yet \u2014 use your email for now.' : 'Apple sign-in isn\u2019t switched on yet \u2014 use your email for now.';
      this.setState({ loading: false, authErr: /not enabled|unsupported|provider/i.test(m) ? off : this._authMsg(err) });
    }
  }
  async _submit() {
    if (this.state.loading) return;
    const em = (this.state.email || '').trim().toLowerCase(), pw = (this.state.password || '').trim();
    if (!em || !pw) { this.setState({ authErr: 'Email and password are required.' }); return; }
    if (!this._validEmail(em)) { this.setState({ authErr: 'Enter a valid email address.' }); return; }
    this.setState({ authErr: '', loading: true });
    try {
      const A = window.PHNTM && window.PHNTM.auth; if (!A) throw new Error('Auth unavailable.');
      let data;
      try { data = await A.signIn(em, pw); }
      catch (e1) {
        const m1 = (e1 && e1.message) || '';
        // wrong password / unconfirmed email are final — never retry those
        if (/invalid login credentials|email not confirmed|password/i.test(m1)) throw e1;
        await new Promise((r) => setTimeout(r, 700));
        data = await A.signIn(em, pw);
      }
      const nm = (data && data.user && data.user.user_metadata && data.user.user_metadata.name) || '';
      try { localStorage.setItem('phntm_email', em); if (nm) localStorage.setItem('phntm-name', nm); } catch (e) {}
      window.location.href = 'PHNTM Dashboard.dc.html';
    } catch (err) {
      this.setState({ loading: false, authErr: this._authMsg(err) });
    }
  }
  componentDidMount() {
    try { const sn = localStorage.getItem('phntm-name'); if (sn) this.setState({ name: sn }); } catch (e) {}
    try { const saved = localStorage.getItem('phntm_email'); if (saved) this.setState({ email: saved }); } catch (e) {}
    // Already signed in? Don't make them log in again — Supabase persists the session.
    (async () => {
      try {
        const A = window.PHNTM && window.PHNTM.auth; if (!A) return;
        // If the dashboard just sent us here, it already decided there's no session —
        // don't bounce straight back and start a loop.
        let bounced = false; try { bounced = sessionStorage.getItem('phntm-bounce') === '1'; } catch (e) {}
        if (bounced) { try { sessionStorage.removeItem('phntm-bounce'); } catch (e) {} return; }
        const s = A.sessionReady ? await A.sessionReady(1200) : await A.currentUser();
        if (s) {
          // keep the loader up and skip the reveal entirely — no form flash
          this.setState({ resuming: true, phase: 'load' });
          if (this._raf) cancelAnimationFrame(this._raf);
          // the mark is already on screen — let the dashboard pick it up instead of
          // playing the same intro a second time
          try { sessionStorage.setItem('phntm-handoff', '1'); } catch (e) {}
          setTimeout(() => window.location.replace('PHNTM Dashboard.dc.html'), 240);
        }
      } catch (e) {}
    })();
    // Full intro on a first visit; brief on every later one in the same session.
    let seen = false; try { seen = sessionStorage.getItem('phntm-intro') === '1'; } catch (e) {}
    try { sessionStorage.setItem('phntm-intro', '1'); } catch (e) {}
    const dur = seen ? 650 : 2000, t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      this.setState({ pct: Math.round(eased * 100) });
      if (p < 1) { this._raf = requestAnimationFrame(tick); }
      else {
        this._t1 = setTimeout(() => this.setState({ phase: 'reveal' }), 220);
        this._t2 = setTimeout(() => this.setState({ phase: 'done' }), 220 + 620);
      }
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._t1); clearTimeout(this._t2); }
  renderVals() {
    // the intro colour is chosen in Settings; a raw-string key can come back JSON-quoted
    const _intro = (() => {
      let raw = null;
      try { raw = localStorage.getItem('phntm-intro-bg-v1'); } catch (e) {}
      if (!raw) return null;
      let v = String(raw).trim();
      if (v[0] === '"') { try { v = JSON.parse(v); } catch (e) { v = v.replace(/^"+|"+$/g, ''); } }
      return /^#[0-9a-f]{6}$/i.test(v) ? v : null;
    })();
    return {
      introBg: _intro || '#0e0e0e',
      email: this.state.email,
      setEmail: (e) => this.setState({ email: e.target.value, authErr: '' }),
      name: this.state.name,
      setName: (e) => this.setState({ name: e.target.value }),
      password: this.state.password,
      setPassword: (e) => this.setState({ password: e.target.value, authErr: '' }),
      passType: this.state.showPass ? 'text' : 'password',
      showPass: !!this.state.showPass,
      notShowPass: !this.state.showPass,
      togglePass: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ showPass: !this.state.showPass }); },
      forgotLabel: this.state.forgotLabel,
      stop: (e) => e.stopPropagation(),
      forgotOpen: !!this.state.forgotOpen,
      forgotEmail: this.state.forgotEmail,
      setForgotEmail: (e) => this.setState({ forgotEmail: e.target.value }),
      forgotSent: !!this.state.forgotSent,
      forgotNotSent: !this.state.forgotSent,
      openForgot: (e) => { e.preventDefault(); this.setState({ forgotOpen: true, forgotSent: false, forgotEmail: (this.state.email || '').trim() }); },
      closeForgot: () => this.setState({ forgotOpen: false }),
      sendForgot: async () => {
        const em = (this.state.forgotEmail || '').trim(); if (!em) return;
        try { const A = window.PHNTM && window.PHNTM.auth; if (A) await A.resetPassword(em); } catch (e) {}
        this.setState({ forgotSent: true });
      },
      signupOpen: !!this.state.signupOpen,
      suName: this.state.suName, setSuName: (e) => this.setState({ suName: e.target.value, suErr: '' }),
      suEmail: this.state.suEmail, setSuEmail: (e) => this.setState({ suEmail: e.target.value, suErr: '' }),
      suPass: this.state.suPass, setSuPass: (e) => this.setState({ suPass: e.target.value, suErr: '' }),
      suErr: this.state.suErr || '',
      hasSuErr: !!this.state.suErr,
      suBtnLabel: this.state.loading ? 'Creating…' : 'Create account →',
      suReadyOpacity: ((this.state.suName || '').trim() && (this.state.suEmail || '').trim() && (this.state.suPass || '').trim()) ? 1 : 0.5,
      openSignup: (e) => { e.preventDefault(); this.setState({ signupOpen: true, suErr: '', authErr: '' }); },
      closeSignup: () => this.setState({ signupOpen: false, loading: false }),
      createAccount: async () => {
        const nm = (this.state.suName || '').trim(), em = (this.state.suEmail || '').trim().toLowerCase(), pw = (this.state.suPass || '').trim();
        if (!nm || !em || !pw) { this.setState({ suErr: 'Name, email and password are required.' }); return; }
        if (!this._validEmail(em)) { this.setState({ suErr: 'Enter a valid email address.' }); return; }
        if (pw.length < 6) { this.setState({ suErr: 'Password must be at least 6 characters.' }); return; }
        if (this.state.loading) return;
        this.setState({ loading: true, suErr: '' });
        try {
          const A = window.PHNTM && window.PHNTM.auth; if (!A) throw new Error('Auth unavailable.');
          const data = await A.signUp(em, pw, nm);
          try { localStorage.setItem('phntm-name', nm); localStorage.setItem('phntm_email', em); } catch (e) {}
          if (data && data.session) {
            try { sessionStorage.setItem('phntm-welcome', '1'); sessionStorage.setItem('phntm-fresh', '1'); } catch (e) {}
            this.setState({ signupOpen: false });
            window.location.href = 'PHNTM Dashboard.dc.html';
          } else {
            this.setState({ loading: false, suErr: 'Account created. Confirm your email, then sign in.' });
          }
        } catch (err) {
          this.setState({ loading: false, suErr: this._authMsg(err) });
        }
      },

      loading: this.state.loading,
      notLoading: !this.state.loading,
      loaderPresent: this.state.resuming || this.state.phase !== 'done',
      loginMounted: !this.state.resuming && this.state.phase !== 'load',
      loaderOpacity: (this.state.resuming || this.state.phase === 'load') ? 1 : 0,
      resumeLabel: this.state.resuming ? 'Welcome back' : 'Loading',
      pctLabel: this.state.pct + '%',
      submit: () => this._submit(),
      googleIn: this._g || (this._g = (e) => { if (e && e.preventDefault) e.preventDefault(); this._oauth('google'); }),
      appleIn: this._a || (this._a = (e) => { if (e && e.preventDefault) e.preventDefault(); this._oauth('apple'); }),
      onPassKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this._submit(); } },
      authErr: this.state.authErr || '',
      hasAuthErr: !!this.state.authErr,
    };
  }
}
</script>
