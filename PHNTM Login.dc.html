<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&family=Michroma&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#060606;color:#eaeaea;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#eaeaea;text-decoration:none}a:hover{color:#fff}
::selection{background:rgba(255,255,255,.2)}
input{outline:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spinRing{to{transform:rotate(360deg)}}
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@keyframes seamShimmer{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drawBorder{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes logoReveal{0%{opacity:0;filter:blur(10px);letter-spacing:.5em}100%{opacity:1;filter:blur(0);letter-spacing:.01em}}
@keyframes fieldsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes riseUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes holoLogoIn{0%{opacity:0;text-shadow:5px 0 rgba(255,255,255,.6),-5px 0 rgba(255,255,255,.4)}55%{opacity:1}100%{opacity:1;text-shadow:0 0 rgba(255,255,255,0)}}
@keyframes holoFlickerIn{0%{opacity:0}10%{opacity:1}15%{opacity:.4}20%{opacity:.85}26%{opacity:1}100%{opacity:1}}
@keyframes holoIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-delay:0ms !important}
  [style*="riseUp"],[style*="fadeUp"]{animation:fadeIn .2s ease both !important}
}
@keyframes cardGlow{0%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5),0 0 0 rgba(255,255,255,0)}30%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5),0 0 34px rgba(180,182,192,.22)}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5),0 0 0 rgba(255,255,255,0)}}
</style>
</helmet>
<div style="position:relative;display:flex;flex-direction:column;min-height:100vh;background:#060606;overflow:hidden">
  <div style="position:absolute;inset:0;background:radial-gradient(120% 55% at 50% 108%,rgba(150,152,162,.18),transparent 60%);zIndex:0"></div>
  <div style="position:absolute;inset:0;background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%223%22 stitchTiles=%22stitch%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>');background-size:200px 200px;mix-blend-mode:overlay;opacity:.6;pointer-events:none;zIndex:0"></div>
  <sc-if value="{{ loaderPresent }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;z-index:5;background:#0b0b0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:60px 54px;opacity:{{ loaderOpacity }};transition:opacity .55s cubic-bezier(.16,1,.3,1)">
      <div style="text-align:center">
        <span style="font-family:'Michroma',sans-serif;font-size:30px;letter-spacing:.02em;color:#fff">phntm<span style="display:inline-block;color:#fff;animation:dotPulse 1.8s ease-in-out infinite">.</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;line-height:1">
        <span style="font-family:'Archivo',sans-serif;font-size:16px;color:#8a8a8a">Loading..</span>
        <div style="font-family:'Archivo',sans-serif;font-size:16px;color:#fff;font-variant-numeric:tabular-nums">{{ pctLabel }}</div>
        <svg width="20" height="20" viewBox="0 0 60 60" style="display:block;animation:spinRing 1.4s linear infinite;overflow:visible">
          <circle cx="30" cy="30" r="27" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 25 60 25"></circle>
        </svg>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ loginMounted }}" hint-placeholder-val="{{ false }}">
  <div style="display:contents">
  <div style="position:relative;zIndex:1;height:40px"></div>
  <div style="position:relative;zIndex:1;flex:1;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="position:relative;width:396px;box-sizing:border-box;padding:46px 42px;display:flex;flex-direction:column;gap:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(14px);animation:fadeUp .5s cubic-bezier(.23,1,.32,1) both,holoFlickerIn .7s both">
      <div style="text-align:center">
        <span style="font-family:'Michroma',sans-serif;font-size:32px;letter-spacing:.01em;color:#fff;display:inline-block;animation:holoLogoIn .5s .06s cubic-bezier(.23,1,.32,1) both">phntm<span style="display:inline-block;color:#fff;animation:dotPulse 1.8s ease-in-out infinite">.</span></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:24px;animation:holoIn .5s .16s cubic-bezier(.23,1,.32,1) both">
        <div>
          <label style="font-size:12px;color:#8a8a8a">Email</label>
          <input type="email" placeholder="ghost@phntm.io" value="{{ email }}" onChange="{{ setEmail }}" style="width:100%;box-sizing:border-box;margin-top:8px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:16px;padding:10px 0;transition:border-color .3s" style-focus="border-color:#fff">
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <label style="font-size:12px;color:#8a8a8a">Password</label>
            <a href="#" onClick="{{ forgot }}" style="font-size:12px;color:#6a6a6a;transition:color .3s" style-hover="color:#fff">{{ forgotLabel }}</a>
          </div>
          <input type="password" placeholder="••••••••••" value="{{ password }}" onChange="{{ setPassword }}" style="width:100%;box-sizing:border-box;margin-top:8px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:16px;padding:10px 0;transition:border-color .3s" style-focus="border-color:#fff">
        </div>
      </div>
      <button onClick="{{ submit }}" style="display:flex;align-items:center;justify-content:center;gap:10px;border:none;background:#fff;color:#000;font-family:'Archivo',sans-serif;font-size:14.5px;font-weight:500;padding:16px;border-radius:99px;cursor:pointer;animation:holoIn .5s .24s cubic-bezier(.23,1,.32,1) both;transition:opacity .3s,transform .16s ease-out,gap .3s" style-hover="opacity:.85;gap:18px" style-active="opacity:.7;transform:scale(.97)">
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
          <span style="width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.2);border-top-color:#000;animation:spinRing .7s linear infinite"></span>
          <span>Signing in…</span>
        </sc-if>
        <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
          <span>Continue</span><span>→</span>
        </sc-if>
      </button>
      <div style="display:flex;align-items:center;gap:16px;animation:riseUp .42s .24s cubic-bezier(.23,1,.32,1) both">
        <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
        <span style="font-size:12px;color:#6a6a6a">or</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
      </div>
      <div style="display:flex;gap:12px;animation:riseUp .42s .3s cubic-bezier(.23,1,.32,1) both">
        <button style="flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:13px;color:#eaeaea;font-family:'Archivo',sans-serif;font-size:13.5px;cursor:pointer;transition:border-color .3s,background .3s,transform .16s ease-out" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)" style-active="transform:scale(.97)">Google</button>
        <button style="flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:13px;color:#eaeaea;font-family:'Archivo',sans-serif;font-size:13.5px;cursor:pointer;transition:border-color .3s,background .3s,transform .16s ease-out" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)" style-active="transform:scale(.97)">Apple</button>
      </div>
      <div style="text-align:center;font-size:13px;color:#8a8a8a;animation:riseUp .42s .36s cubic-bezier(.23,1,.32,1) both">New to PHNTM? <a href="#" style="color:#eaeaea;background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-position:0 100%;background-size:0% 1px;padding-bottom:3px;transition:background-size .45s cubic-bezier(.16,1,.3,1)" style-hover="background-size:100% 1px">Sign up</a></div>
    </div>
  </div>
  <div style="position:relative;zIndex:1;height:36px"></div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { name: '', email: '', password: '', loading: false, phase: 'load', pct: 0, forgotLabel: 'Forgot?' };
  componentDidMount() {
    try { const sn = localStorage.getItem('phntm-name'); if (sn) this.setState({ name: sn }); } catch (e) {}
    try { const saved = localStorage.getItem('phntm_email'); if (saved) this.setState({ email: saved }); } catch (e) {}
    const dur = 2000, t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      this.setState({ pct: Math.round(eased * 100) });
      if (p < 1) { this._raf = requestAnimationFrame(tick); }
      else {
        this._t1 = setTimeout(() => this.setState({ phase: 'reveal' }), 220);
        this._t2 = setTimeout(() => this.setState({ phase: 'done' }), 220 + 620);
      }
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); clearTimeout(this._t1); clearTimeout(this._t2); }
  renderVals() {
    return {
      email: this.state.email,
      setEmail: (e) => this.setState({ email: e.target.value }),
      name: this.state.name,
      setName: (e) => this.setState({ name: e.target.value }),
      password: this.state.password,
      setPassword: (e) => this.setState({ password: e.target.value }),
      forgotLabel: this.state.forgotLabel,
      forgot: (e) => {
        e.preventDefault();
        const em = (this.state.email || '').trim();
        this.setState({ forgotLabel: em ? 'Reset link sent →' : 'Enter your email first' });
        clearTimeout(this._tf);
        this._tf = setTimeout(() => this.setState({ forgotLabel: 'Forgot?' }), 2600);
      },
      loading: this.state.loading,
      notLoading: !this.state.loading,
      loaderPresent: this.state.phase !== 'done',
      loginMounted: this.state.phase !== 'load',
      loaderOpacity: this.state.phase === 'load' ? 1 : 0,
      pctLabel: this.state.pct + '%',
      submit: () => {
        if (this.state.loading) return;
        try { localStorage.setItem('phntm_email', (this.state.email || '').trim()); localStorage.setItem('phntm-name', (this.state.name || '').trim()); } catch (e) {}
        this.setState({ loading: true });
        setTimeout(() => { window.location.href = 'PHNTM Dashboard.dc.html'; }, 1000);
      },
    };
  }
}
</script>
</body>
</html>
