<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0a0a0a;color:#eaeaea;font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:rgba(255,255,255,.2)}
.mark{font-family:'Space Grotesk',sans-serif;font-size:40px;font-weight:300;letter-spacing:-.01em;color:#fff}
.mark .ltr{display:inline-block}

/* 4a — smoke sweep: a dark shadow slides through the letters L→R */
@keyframes smokeSweep{0%,100%{background-position:200% 0}45%{background-position:-100% 0}}
.a-smoke{background:linear-gradient(100deg,#fff 0%,#fff 38%,#050505 46%,#000 50%,#050505 54%,#fff 62%,#fff 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:smokeSweep 3.6s cubic-bezier(.6,0,.4,1) infinite}

/* 4b — phantom dissolve: each letter fades/blurs in from smoke, staggered */
@keyframes phantomIn{0%{opacity:0;filter:blur(8px);transform:translateY(4px) scaleX(1.3)}100%{opacity:1;filter:blur(0);transform:none}}
.a-dissolve .ltr{animation:phantomIn 1.1s cubic-bezier(.2,.8,.2,1) infinite alternate}

/* 4c — draining ink: letters wash to grey then recover, like a passing shadow */
@keyframes drain{0%,100%{color:#fff}50%{color:#3a3a3a}}
.a-drain .ltr{animation:drain 2.4s ease-in-out infinite}

/* 4d — breathing dot */
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.a-dot .dot{display:inline-block;animation:dotPulse 1.8s ease-in-out infinite}

/* 4e — glint: a thin light bar crosses once per cycle */
@keyframes glint{0%,70%,100%{background-position:220% 0}82%{background-position:-40% 0}}
.a-glint{background:linear-gradient(105deg,#cfcfcf 0%,#cfcfcf 44%,#fff 50%,#cfcfcf 56%,#cfcfcf 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:glint 4s ease-in-out infinite}

/* 4f — letter flicker: phantom presence, letters briefly dim out of sequence */
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}94%{opacity:.15}96%{opacity:1}}
.a-flicker .ltr{animation:flick 3s linear infinite}

/* 4g — rise: letters lift & settle in sequence, soft shadow underneath */
@keyframes rise{0%,100%{transform:translateY(0);text-shadow:0 0 0 rgba(0,0,0,0)}50%{transform:translateY(-7px);text-shadow:0 10px 14px rgba(0,0,0,.6)}}
.a-rise .ltr{animation:rise 2.6s ease-in-out infinite}
</style>
</helmet>
<section style="padding:56px 60px">
  <div style="margin-bottom:34px">
    <div style="font-size:26px;font-weight:200;color:#fff">phntm. — 7 logo animations</div>
    <div style="margin-top:8px;font-size:13.5px;color:#7a7a7a">Subtle, looping, monochrome. 4a is the Voldemort black-smoke sweep. Reference an id (e.g. 4a) to set it live.</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:22px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="7">
      <div id="{{ c.id }}" style="width:400px">
        <div style="height:200px;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 30%,#1b1b1b,#0c0c0c);border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden">
          {{ c.mark }}
        </div>
        <div style="display:flex;align-items:baseline;gap:12px;margin-top:14px">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#000;background:#fff;padding:3px 8px;border-radius:99px">{{ c.id }}</span>
          <div><div style="font-size:14px;color:#fff">{{ c.title }}</div><div style="font-size:12px;color:#7a7a7a">{{ c.body }}</div></div>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const letters = ['p', 'h', 'n', 't', 'm'];
    // staggered per-letter mark
    const staggered = (cls, stepMs) => h('span', { className: 'mark ' + cls },
      letters.map((L, i) => h('span', { key: i, className: 'ltr', style: { animationDelay: (i * stepMs) + 'ms' } }, L))
        .concat(h('span', { key: 'd', className: 'ltr', style: { animationDelay: (letters.length * stepMs) + 'ms' } }, '.')));
    // single-gradient mark (sweep/glint apply to whole word)
    const gradient = (cls) => h('span', { className: 'mark ' + cls }, 'phntm.');
    // dot-only animation
    const dotMark = () => h('span', { className: 'mark a-dot' }, ['phntm', h('span', { key: 'd', className: 'dot' }, '.')]);

    const cards = [
      { id: '4a', title: 'Smoke sweep', body: 'Black smoke slides through the letters — the Voldemort pass', mark: gradient('a-smoke') },
      { id: '4b', title: 'Phantom dissolve', body: 'Each letter condenses out of blur, staggered', mark: staggered('a-dissolve', 120) },
      { id: '4c', title: 'Draining shadow', body: 'A dark wave washes letter to letter and recovers', mark: staggered('a-drain', 180) },
      { id: '4d', title: 'Breathing dot', body: 'Wordmark still; the period pulses like a heartbeat', mark: dotMark() },
      { id: '4e', title: 'Light glint', body: 'A thin highlight crosses the mark once per cycle', mark: gradient('a-glint') },
      { id: '4f', title: 'Phantom flicker', body: 'Letters briefly vanish out of sequence — a ghost signal', mark: staggered('a-flicker', 300) },
      { id: '4g', title: 'Rise & settle', body: 'Letters lift with a soft cast shadow, in sequence', mark: staggered('a-rise', 140) },
    ];
    return { cards };
  }
}
</script>
</body>
</html>
