<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
</style>
</helmet>
<div style="position:relative;width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box">
  <div style="display:flex;align-items:center;justify-content:flex-end;padding:30px 40px;animation:fadeIn .9s ease both">
    <span style="font-family:'Archivo',sans-serif;font-size:22px;font-weight:500;letter-spacing:-.01em;color:#fff">phntm<span style="display:inline-block;animation:dotPulse 1.8s ease-in-out infinite">.</span></span>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:8px">
    <div style="width:372px;box-sizing:border-box;padding:40px 38px;display:flex;flex-direction:column;gap:24px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.1);border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(14px);animation:fadeUp .9s .1s cubic-bezier(.16,1,.3,1) both">
      <div>
        <div style="font-size:31px;font-weight:200;letter-spacing:-.02em;color:#fff">Welcome back</div>
        <div style="margin-top:9px;font-size:14px;color:#8a8a8a;line-height:1.6">Sign in to your journal.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:22px">
        <div>
          <label style="font-size:12px;color:#8a8a8a">Email</label>
          <input type="email" placeholder="ghost@phntm.io" style="width:100%;box-sizing:border-box;margin-top:8px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:15px;padding:9px 0;outline:none;transition:border-color .3s" style-focus="border-color:#fff">
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <label style="font-size:12px;color:#8a8a8a">Password</label>
            <a href="#" style="font-size:12px;color:#6a6a6a;text-decoration:none;transition:color .3s" style-hover="color:#fff">Forgot?</a>
          </div>
          <input type="password" placeholder="••••••••••" style="width:100%;box-sizing:border-box;margin-top:8px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Archivo',sans-serif;font-size:15px;padding:9px 0;outline:none;transition:border-color .3s" style-focus="border-color:#fff">
        </div>
      </div>
      <button style="display:flex;align-items:center;justify-content:center;gap:10px;border:none;background:#fff;color:#000;font-family:'Archivo',sans-serif;font-size:14px;font-weight:500;padding:15px;border-radius:99px;cursor:pointer;transition:opacity .3s,gap .3s" style-hover="opacity:.85;gap:18px" style-active="opacity:.7">
        <span>Continue</span><span>→</span>
      </button>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
        <span style="font-size:12px;color:#6a6a6a">or</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,.12)"></div>
      </div>
      <div style="display:flex;gap:12px">
        <button style="flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:12px;color:#eaeaea;font-family:'Archivo',sans-serif;font-size:13px;cursor:pointer;transition:border-color .3s,background .3s" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)">Google</button>
        <button style="flex:1;background:none;border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:12px;color:#eaeaea;font-family:'Archivo',sans-serif;font-size:13px;cursor:pointer;transition:border-color .3s,background .3s" style-hover="border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)">Apple</button>
      </div>
      <div style="text-align:center;font-size:13px;color:#8a8a8a">New to PHNTM? <a href="#" style="color:#eaeaea;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.3)">Sign up</a></div>
    </div>
  </div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 40px 28px;animation:fadeIn .9s .4s ease both">
    <span style="font-size:13px;font-weight:200;color:#9a9a9a">Every trade leaves a trace.</span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#5c5c5c">EST. 2026</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:660,&quot;height&quot;:720}}"></script>
</body>
</html>
